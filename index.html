<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cetak Struk - Android Mobil Karawang</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; padding: 20px; background-color: #f4f4f9; }
        .container { max-width: 380px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h3 { margin-top: 0; color: #333; }
        /* Tombol disembunyikan sejak awal (display: none) agar tidak berkedip saat loading */
        button { display: none; padding: 12px 20px; font-size: 16px; cursor: pointer; background-color: #28a745; color: white; border: none; border-radius: 6px; width: 100%; font-weight: bold; margin-bottom: 10px; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        .btn-secondary { background-color: #6c757d; font-size: 13px; padding: 8px 15px; }
        #status { margin-top: 10px; font-size: 13px; color: #555; font-weight: 500; line-height: 1.4; }
        .preview { text-align: left; background: #fffdf5; padding: 15px; border: 1px dashed #888; font-family: monospace; white-space: pre-wrap; margin-bottom: 20px; font-size: 12px; line-height: 1.4; overflow-x: auto; }
    </style>
</head>
<body>

    <div class="container">
        <h3>Preview Nota Transaksi</h3>
        <div class="preview" id="receiptPreview">Memuat data struk...</div>
        <button id="printBtn">🖨️ Cetak Struk Sekarang</button>
        <button id="pairBtn" class="btn-secondary">🔍 Scan / Ganti Printer Baru</button>
        <div id="status">Mendeteksi printer...</div>
    </div>

    <script>
        // 1. Menangkap parameter dari AppSheet
        const p = new URLSearchParams(window.location.search);
        const pt      = p.get('pt') || 'ANDROID MOBIL KARAWANG';
        const alamat  = p.get('alamat') || '-';
        const telp    = p.get('telp') || '-';
        const tgl     = p.get('tgl') || '-';
        const id      = p.get('id') || '-';
        const ket     = p.get('ket') || '-';
        const item    = p.get('item') || '-';
        const sub     = p.get('sub') || '0';
        const diskon  = p.get('diskon') || '0';
        const total   = p.get('total') || '0';
        const tunai   = p.get('tunai') || '0';
        const kembali = p.get('kembali') || '0';

// Fungsi otomatis membuat teks rata tengah (Lebar 32 Karakter)
        function tengah(teks, lebar = 32) {
            return teks.split('\n').map(baris => {
                // Jika kalimat kepanjangan (>32 huruf), potong rapi per kata ke baris bawah
                if (baris.length > lebar) {
                    const kata = baris.split(' ');
                    let hasil = [], barisSaatIni = '';
                    kata.forEach(k => {
                        if ((barisSaatIni + k).length > lebar) {
                            hasil.push(barisSaatIni.trim());
                            barisSaatIni = k + ' ';
                        } else {
                            barisSaatIni += k + ' ';
                        }
                    });
                    if (barisSaatIni.trim()) hasil.push(barisSaatIni.trim());
                    return hasil.map(b => ' '.repeat(Math.max(0, Math.floor((lebar - b.length) / 2))) + b).join('\n');
                }
                // Hitung sisa ruang dan tambahkan spasi di kiri
                const spasiKiri = Math.max(0, Math.floor((lebar - baris.length) / 2));
                return ' '.repeat(spasiKiri) + baris;
            }).join('\n');
        }
        
        // 2. Menyusun tata letak struk (Cukup bungkus dengan fungsi tengah)
        const receiptText = 
`${tengah(pt)}
${tengah(alamat)}
${tengah(telp)}
--------------------------------
Tanggal    : ${tgl}
ID         : ${id}
Keterangan : ${ket}
--------------------------------
${item}
--------------------------------
Subtotal : ${sub}
Diskon   : ${diskon}
--------------------------------
TOTAL    : ${total}
TUNAI    : ${tunai}
KEMBALI  : ${kembali}
--------------------------------
${tengah("TERIMA KASIH")}
${tengah("Bawa Struk & Box Ini")}
${tengah("Untuk Klaim Garansi")}
\n\n\n`;

        document.getElementById('receiptPreview').innerText = receiptText;

        const SERVICE_UUIDS = [
            '000018f0-0000-1000-8000-00805f9b34fb',
            'e7810a71-73ae-499d-8c15-faa9aef0c3f2',
            '49535343-fe7d-4ae5-8fa9-9fafd205e455'
        ];

        const btnPrint = document.getElementById('printBtn');
        const btnPair = document.getElementById('pairBtn');
        const statusEl = document.getElementById('status');

        // Fungsi pembantu untuk mengatur visibilitas tombol
        function showButtons(showPrint = true, showPair = true) {
            btnPrint.style.display = showPrint ? 'block' : 'none';
            btnPair.style.display = showPair ? 'block' : 'none';
            btnPrint.disabled = false;
            btnPair.disabled = false;
        }

        function hideButtons() {
            btnPrint.style.display = 'none';
            btnPair.style.display = 'none';
        }

        // Mencari karakteristik Write pada printer
        async function getWriteCharacteristic(server) {
            for (const uuid of SERVICE_UUIDS) {
                try {
                    const service = await server.getPrimaryService(uuid);
                    const chars = await service.getCharacteristics();
                    const writeChar = chars.find(c => c.properties.writeWithoutResponse || c.properties.write);
                    if (writeChar) return writeChar;
                } catch (e) {
                    // Lanjut cek UUID berikutnya
                }
            }
            throw new Error("Jalur cetak (UUID) tidak ditemukan.");
        }

        // Membuka kunci izin Bluetooth di tab baru dengan menangkap sinyal iklan BLE
        async function connectWithRetry(device, isFromSaved = false) {
            if (isFromSaved && device.watchAdvertisements) {
                statusEl.innerText = `Mendeteksi sinyal ${device.name || 'Printer'}...`;
                const abortController = new AbortController();
                
                await new Promise((resolve) => {
                    const timer = setTimeout(() => {
                        abortController.abort();
                        resolve();
                    }, 3500);

                    device.addEventListener('advertisementreceived', () => {
                        clearTimeout(timer);
                        abortController.abort();
                        resolve();
                    }, { once: true });

                    device.watchAdvertisements({ signal: abortController.signal }).catch(() => {
                        clearTimeout(timer);
                        resolve();
                    });
                });

                await new Promise(r => setTimeout(r, 250));
            }

            let lastError;
            for (let attempt = 1; attempt <= 3; attempt++) {
                try {
                    statusEl.innerText = `Menghubungkan ke ${device.name || 'Printer'} (${attempt}/3)...`;
                    if (device.gatt.connected) {
                        device.gatt.disconnect();
                        await new Promise(r => setTimeout(r, 300));
                    }
                    return await device.gatt.connect();
                } catch (err) {
                    lastError = err;
                    await new Promise(r => setTimeout(r, 500));
                }
            }
            throw lastError;
        }

        // Fungsi utama mencetak ke printer
        async function printToDevice(device, isFromSaved = false) {
            hideButtons();

            try {
                const server = await connectWithRetry(device, isFromSaved);
                const writeChar = await getWriteCharacteristic(server);

                statusEl.innerText = "Mencetak struk...";

                const encoder = new TextEncoder();
                const initPrinter = new Uint8Array([0x1B, 0x40]);
                const textBytes = encoder.encode(receiptText);
                
                const fullData = new Uint8Array(initPrinter.length + textBytes.length);
                fullData.set(initPrinter, 0);
                fullData.set(textBytes, initPrinter.length);

                const CHUNK_SIZE = 100;
                for (let i = 0; i < fullData.length; i += CHUNK_SIZE) {
                    const chunk = fullData.slice(i, i + CHUNK_SIZE);
                    if (writeChar.properties.writeWithoutResponse) {
                        await writeChar.writeValueWithoutResponse(chunk);
                    } else {
                        await writeChar.writeValue(chunk);
                    }
                    await new Promise(r => setTimeout(r, 30));
                }

                // Langsung putus koneksi Bluetooth begitu selesai cetak agar tidak menggantung
                await new Promise(r => setTimeout(r, 300));
                if (device.gatt.connected) {
                    device.gatt.disconnect();
                }

                // Hitung mundur untuk melihat preview sebelum tab tertutup otomatis
                let secondsLeft = 8;
                statusEl.innerText = `✅ Berhasil dicetak! Menutup otomatis dalam ${secondsLeft} detik...`;

                const countdownInterval = setInterval(() => {
                    secondsLeft--;
                    if (secondsLeft > 0) {
                        statusEl.innerText = `✅ Berhasil dicetak! Menutup otomatis dalam ${secondsLeft} detik...`;
                    } else {
                        clearInterval(countdownInterval);
                        window.open('', '_self', '');
                        window.close();
                        // Jika browser memblokir auto-close (misal karena tab di-refresh manual)
                        statusEl.innerText = "✅ Berhasil dicetak & Bluetooth diputus. Silakan tutup tab ini.";
                        showButtons(true, true);
                    }
                }, 1000);

            } catch (err) {
                console.error(err);
                statusEl.innerText = `❌ Gagal konek (${err.message}). Silakan coba lagi atau scan ulang.`;
                // Munculkan tombol HANYA jika gagal konek
                showButtons(true, true);
            }
        }

        // Mengambil printer yang sudah pernah diizinkan
        async function getSavedPrinter() {
            if (!navigator.bluetooth || !navigator.bluetooth.getDevices) return null;
            const devices = await navigator.bluetooth.getDevices();
            return devices.length > 0 ? devices[0] : null;
        }

        // Memunculkan Pop-up Scan
        async function requestNewPrinter() {
            try {
                statusEl.innerText = "Pilih printer RPP02N pada pop-up...";
                const device = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: SERVICE_UUIDS
                });
                await printToDevice(device, false);
            } catch (err) {
                statusEl.innerText = "❌ Pencarian printer dibatalkan.";
                showButtons(false, true);
            }
        }

        // Tombol Cetak Utama
        btnPrint.addEventListener('click', async () => {
            const savedDevice = await getSavedPrinter();
            if (savedDevice) {
                await printToDevice(savedDevice, true);
            } else {
                await requestNewPrinter();
            }
        });

        // Tombol Scan Manual
        btnPair.addEventListener('click', requestNewPrinter);

        // LOGIKA TERBALIK SAAT HALAMAN DIMUAT:
        // Tombol tetap tersembunyi. Jika ada printer tersimpan, langsung terobos print.
        window.addEventListener('load', async () => {
            const savedDevice = await getSavedPrinter();
            if (savedDevice) {
                await printToDevice(savedDevice, true);
            } else {
                // Jika belum pernah pairing sama sekali, baru munculkan tombol Scan
                statusEl.innerText = "Printer belum terhubung. Klik tombol di bawah untuk menghubungkan pertama kali.";
                showButtons(false, true);
            }
        });
    </script>
</body>
</html>
